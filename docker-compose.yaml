name: firecrawl

# ======================================================================
# Firecrawl Self-Host with Max Performance + Research Service + SearXNG
# ======================================================================
# This docker-compose assumes the Firecrawl source is cloned at ./firecrawl
# and the research-service is at ./research-service
# ======================================================================

x-common-service: &common-service
  build: ./firecrawl/apps/api
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  networks:
    - backend
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

x-common-env: &common-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_RATE_LIMIT_URL: ${REDIS_URL:-redis://redis:6379}
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}
  POSTGRES_USER: ${POSTGRES_USER:-firecrawl}
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: ${POSTGRES_HOST:-nuq-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
  DATABASE_URL: ${DATABASE_URL:-}
  DB_POOL_MAX: ${DB_POOL_MAX:-8}

  # --- Performance tuning (maxed out) ---
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-32}
  NUQ_WORKER_COUNT: ${NUQ_WORKER_COUNT:-32}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-50}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-50}
  SELF_HOSTED_CONCURRENCY_LIMIT: ${SELF_HOSTED_CONCURRENCY_LIMIT:-50}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-20}

  MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY:-}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY:?Run setup.sh to generate BULL_AUTH_KEY}
  TEST_API_KEY: ${TEST_API_KEY:-}
  SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN:-}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN:-}
  SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL:-}
  BROWSER_SERVICE_URL: ${BROWSER_SERVICE_URL:-http://playwright-service:3000}
  BROWSER_SERVICE_API_KEY: ${BROWSER_SERVICE_API_KEY:?Run setup.sh to generate BROWSER_SERVICE_API_KEY}
  BROWSER_SERVICE_WEBHOOK_SECRET: ${BROWSER_SERVICE_WEBHOOK_SECRET:-}
  LOGGING_LEVEL: ${LOGGING_LEVEL:-info}
  PROXY_SERVER: ${PROXY_SERVER:-}
  PROXY_USERNAME: ${PROXY_USERNAME:-}
  PROXY_PASSWORD: ${PROXY_PASSWORD:-}

  # --- SearXNG search backend ---
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT:-http://searxng:8080}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES:-google,bing,duckduckgo,wikipedia}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES:-general}

  # --- Research service ---
  RESEARCH_PROXY_URL: ${RESEARCH_PROXY_URL:-http://research-service:8000}

  # Set NUQ_BACKEND=fdb to run the queue on FoundationDB instead of Postgres
  NUQ_BACKEND: ${NUQ_BACKEND:-}
  FDB_CLUSTER_FILE: ${FDB_CLUSTER_FILE:-}

services:
  playwright-service:
    restart: unless-stopped
    build: ./firecrawl/apps/playwright-service-ts
    environment:
      PORT: 3000
      PROXY_SERVER: ${PROXY_SERVER:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS:-}
      BLOCK_MEDIA: ${BLOCK_MEDIA:-}
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-50}
      BROWSER_SERVICE_API_KEY: ${BROWSER_SERVICE_API_KEY:?Run setup.sh to generate BROWSER_SERVICE_API_KEY}
      BROWSER_SERVICE_PUBLIC_URL: ${BROWSER_SERVICE_PUBLIC_URL:-http://playwright-service:3000}
    networks:
      - backend
    mem_limit: 32G
    memswap_limit: 32G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=4g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    restart: unless-stopped
    <<: *common-service
    # Keep the project's LLM configuration authoritative. Docker Compose
    # otherwise lets a host OPENAI_API_KEY override the value in .env.
    env_file:
      - .env
    environment:
      <<: *common-env
      HOST: "0.0.0.0"
      PORT: ${INTERNAL_PORT:-3002}
      EXTRACT_WORKER_PORT: ${EXTRACT_WORKER_PORT:-3004}
      WORKER_PORT: ${WORKER_PORT:-3005}
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-120000}
      ENV: local
    depends_on:
      redis:
        condition: service_healthy
      playwright-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      research-service:
        condition: service_healthy
      searxng:
        condition: service_healthy
      foundationdb-init:
        condition: service_completed_successfully
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${PORT:-3002}:${INTERNAL_PORT:-3002}"
    volumes:
      - fdb-cluster-file:/var/fdb:ro
    command: node dist/src/harness.js --start-docker
    mem_limit: 64G
    memswap_limit: 64G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${PORT}/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  redis:
    restart: unless-stopped
    image: redis@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    networks:
      - backend
    command: redis-server --bind 0.0.0.0 --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    networks:
      - backend
    command: rabbitmq-server
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  nuq-postgres:
    restart: unless-stopped
    build: ./firecrawl/apps/nuq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firecrawl}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    networks:
      - backend
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  foundationdb:
    restart: unless-stopped
    image: foundationdb/foundationdb:7.3.63
    environment:
      FDB_NETWORKING_MODE: container
      FDB_COORDINATOR_PORT: 4500
    networks:
      - backend
    volumes:
      - fdb-data:/var/fdb/data
      - fdb-cluster-file:/var/fdb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  foundationdb-init:
    image: foundationdb/foundationdb:7.3.63
    depends_on:
      - foundationdb
    entrypoint:
      - /bin/bash
      - -c
      - "for attempt in $$(seq 1 60); do out=$$(fdbcli -C /var/fdb/fdb.cluster --exec 'configure new single ssd' 2>&1); status=$$?; printf '%s\n' \"$$out\"; if [ \"$$status\" -eq 0 ] || printf '%s\n' \"$$out\" | grep -Eiq 'already.*configured|database.*configured|database already exists'; then exit 0; fi; sleep 2; done; exit 1"
    volumes:
      - fdb-cluster-file:/var/fdb
    networks:
      - backend
    restart: "no"

  # ==================================================================
  # SearXNG — meta-search engine (Google + Bing + DuckDuckGo + Wikipedia)
  # Replaces DuckDuckGo direct search which gets IP-banned easily.
  # ==================================================================
  searxng:
    restart: unless-stopped
    image: searxng/searxng@sha256:11a9b34cdc0b1ec2b991470a2762ecb5a1a531898289fb51dcd015260450729e
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
      - SEARXNG_SECRET=${SEARXNG_SECRET:?Run setup.sh to generate SEARXNG_SECRET}
    networks:
      - backend
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Applies the public Drizzle schema plus local-only persistence indexes before
  # the API starts. It is safe to run again after an upstream source update.
  db-init:
    restart: "no"
    <<: *common-service
    env_file:
      - .env
    environment:
      <<: *common-env
      ENV: local
    depends_on:
      nuq-postgres:
        condition: service_healthy
    volumes:
      - ./db-init.js:/tmp/db-init.js:ro
    command: ["node", "/tmp/db-init.js"]

  # ==================================================================
  # Research Service — custom FastAPI proxy for 5 research endpoints
  #   search_papers  -> OpenAlex API
  #   inspect_paper  -> arXiv API + OpenAlex
  #   read_paper     -> Downloads arXiv PDF, extracts relevant passages
  #   related_papers -> OpenAlex citation graph
  #   search_github  -> GitHub Search API (repos + issues/PRs)
  # ==================================================================
  research-service:
    restart: unless-stopped
    build: ./research-service
    environment:
      S2_API_KEY: ${S2_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MAILTO: ${MAILTO:-research@firecrawl.local}
    networks:
      - backend
    mem_limit: 16G
    memswap_limit: 16G
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  backend:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  rabbitmq-data:
  fdb-data:
  fdb-cluster-file:
