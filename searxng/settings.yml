use_default_settings: true

server:
  # The official image replaces this placeholder with SEARXNG_SECRET at startup.
  secret_key: "ultrasecretkey"
  image_proxy: true
  limiter: false
  public_instance: false
  bind_address: 0.0.0.0

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: google news
    engine: google_news
    shortcut: gnews
    disabled: false
  - name: bing news
    engine: bing_news
    shortcut: bnews
    disabled: false
  - name: google images
    engine: google_images
    shortcut: goimg
    disabled: false
  - name: bing images
    engine: bing_images
    shortcut: bimg
    disabled: false
