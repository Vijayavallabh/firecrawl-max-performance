use_default_settings: true

server:
  secret_key: "CHANGE_ME_TO_A_RANDOM_STRING"
  image_proxy: true
  limiter: false
  public_instance: false
  bind_address: 0.0.0.0

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
